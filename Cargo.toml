[package]
name = "leal"
version = "0.0.24"
edition = "2021"
description = "Rust client for the Leal loyalty API."
license = "MIT"
repository = "https://github.com/lealhq/leal-rust-sdk"
documentation = "https://www.getleal.com/developers/rust"

[lib]
doctest = false

[dependencies]
bytes = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

